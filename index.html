<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commit the Garde! Digital</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; background: #1a1a1a; overflow: hidden; font-family: system-ui, sans-serif; }
      #app-content, #app-content *, #modal-overlay * { box-sizing: border-box; }
      #app-shell { display: flex; flex-direction: column; height: 100vh; }
      #nav-bar { flex: none; }
      #app-content { display: flex; flex-direction: column; flex: 1; min-height: 0; background: #1a1a1a; }

      /* Core play's own top bar (src/ui/play/topbar.ts) — also reused by
         the Deployment screen's own header (src/ui/deployment.ts,
         renderDeploymentTopbar), so it's populated in both phases; empty
         only while the Order of Battle screen (Stage 4) is showing instead
         of the board. `display: flex` lives here (not just in the render
         functions' own inline `style.cssText`) so `updateScreenVisibility`'s
         `style.display = ""` — clearing the "none" it sets on full-width
         screens — has a real stylesheet value to fall back to instead of a
         bare `<div>`'s default `block` (which stacks the bar's children
         vertically instead of in a row). */
      #play-topbar { display: flex; }
      #play-topbar:empty { display: none; }

      /* Battle Time Bar (src/ui/play/battleTimeBar.ts) — the graphical
         Dawn/Day/Twilight/Night timeline that replaced the old plain-text
         clock readout, docked directly below #play-topbar. Same "reused by
         both play and deployment phases, empty (thus hidden) whenever
         #play-topbar itself is" pattern as #play-topbar/#turn-order-ribbon. */
      #battle-time-bar { display: flex; }
      #battle-time-bar:empty { display: none; }

      /* Turn order ribbon (src/ui/play/turnOrderRibbon.ts) — passive 6-step
         Army Command Sheet checklist shown only during the play phase
         (empty, thus hidden, during deployment/Order of Battle/game-over,
         same screens #play-topbar itself blanks on). Same `display: flex`
         fallback reasoning as #play-topbar above. */
      #turn-order-ribbon { display: flex; }
      #turn-order-ribbon:empty { display: none; }

      /* The 3-column play layout (log / board / inspector). Column widths
         are set imperatively in main.ts (log column collapsed to 0 during
         deployment in favor of #deploy-sidebar, and when toggled shut;
         the inspector column stays visible in both phases) since they
         depend on game-state, not just CSS. */
      #play-grid { position: relative; flex: 1; min-height: 0; display: grid; }
      #play-log { min-width: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--color-bg); }
      /* Same grid cell as #play-log (column 1, row 1) — the two are shown/
         hidden by main.ts depending on deployment vs. play phase, never
         both at once, so they can share the column-1 width the grid track
         is given. */
      /* `scrollbar-gutter: stable` reserves the vertical scrollbar's track
         width even under overlay-style scrollbars (this app's default dev/
         test Chromium among them) — without it, an overlay scrollbar floats
         on top of the content instead of carving out space, covering the
         rightmost text (e.g. a row's "Not yet placed" status) in the list
         below. Human-reported 2026-08-28. */
      #deploy-sidebar { grid-column: 1; grid-row: 1; min-width: 0; overflow-y: auto; scrollbar-gutter: stable; background: var(--color-bg); display: none; }
      /* No padding directly on #play-inspector itself — box-sizing:border-box
         still can't shrink a padded box's rendered width below its padding,
         so a fixed-content grid item's track collapsing to 0 (were this
         column ever hidden) would otherwise leave a visible sliver.
         inspector.ts puts the padding on an inner wrapper instead. */
      #play-inspector { min-width: 0; overflow-y: auto; border-left: 1px solid var(--color-divider); background: var(--color-bg); }

      /* -- The board column: unchanged dark canvas + the pre-overhaul
         overlay panels (#ui/#view-controls), now scoped to this column
         instead of the whole viewport. #ui carries any in-progress
         play-phase pending-action hint (Stage 2 deliberately keeps those as
         a small non-blocking box rather than moving them into the order
         popover — see orderModal.ts's doc comment — except Redeploy's
         formation/facing step and March's arrival-facing step, which each
         got their own popover instead, #redeploy-modal-overlay/
         #march-facing-modal-overlay below); #ui is unused during deployment
         now (Stage 3 moved that to #deploy-sidebar/#deploy-panel below). -- */
      #board-col { position: relative; overflow: hidden; background: #1a1a1a; }
      #app { width: 100%; height: 100%; }
      /* Deployment's hex→formation→facing floating panel
         (src/ui/deployment.ts, renderDeploymentPanel) — same wrapper
         pattern as #order-modal-overlay below: a full-bleed, click-through
         layer whose one real child opts back into pointer events. */
      #deploy-panel { position: absolute; inset: 0; pointer-events: none; }
      #deploy-panel:empty { display: none; }
      #ui {
        position: absolute; top: 12px; left: 12px; width: 260px;
        background: rgba(20, 20, 20, 0.88); color: #e0d8c0; border: 1px solid #4a4a4a;
        border-radius: 6px; padding: 10px; font-size: 13px; pointer-events: auto;
      }
      #ui:empty { display: none; }
      #ui h2 { margin: 0 0 6px; font-size: 14px; color: #ffdd55; }
      #ui .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
      #ui .unit-list { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; max-height: 55vh; overflow-y: auto; }
      #ui .unit-list button { width: 100%; text-align: left; }
      #ui .unit-list button.placed { border-color: #7fbf7f; }
      #ui button, #view-controls button {
        background: #333; color: #e0d8c0; border: 1px solid #555; border-radius: 4px;
        padding: 5px 8px; font-size: 12px; cursor: pointer;
      }
      #ui button:hover, #view-controls button:hover { background: #444; }
      #ui button.active, #view-controls button.active { background: #6b5b1a; border-color: #ffdd55; }
      #ui button:disabled { opacity: 0.4; cursor: default; }
      #ui .arrow { transform-origin: center; display: inline-block; }
      #ui .hint { color: #999; font-size: 11px; margin-top: 4px; }
      #ui .empty { color: #999; }
      /* Shared red top-of-board banner look. Track B stage B-5's
         #network-banner (a one-line status for a network game's own
         connection — "Connecting…"/"Reconnecting…"/the last server-rejected
         action's error message; empty/hidden in local hotseat and whenever a
         network game has nothing to report) and #action-banner (human-
         requested 2026-08-24: transient in-game notices like "Already
         activated this turn" — auto-fades after a few seconds, or dismisses
         immediately on click) both use it. */
      .top-banner {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        background: rgba(60, 20, 20, 0.92); color: #f2c9c9; border: 1px solid #8a3a3a;
        border-radius: 6px; padding: 6px 14px; font-size: 12px;
        max-width: 70%; text-align: center; z-index: 4;
        transition: opacity 0.4s ease;
      }
      #network-banner { pointer-events: none; }
      #action-banner { pointer-events: auto; cursor: pointer; }
      #view-controls {
        position: absolute; bottom: 12px; right: 12px; display: flex; gap: 6px;
        background: rgba(20, 20, 20, 0.88); border: 1px solid #4a4a4a; border-radius: 6px;
        padding: 8px; pointer-events: auto;
      }
      #log-toggle {
        position: absolute; left: 0; top: 50%; transform: translateY(-50%);
        background: rgba(20, 20, 20, 0.88); color: #e0d8c0; border: 1px solid #4a4a4a; border-left: none;
        padding: 10px 4px; cursor: pointer; font-size: 12px; z-index: 2;
      }
      #log-toggle:empty { display: none; }

      /* End Turn confirm — still a real full-screen dimmed dialog (unlike
         the order popover below), no feedback against this one. */
      #modal-overlay { position: absolute; inset: 0; pointer-events: none; }
      #modal-overlay:empty { display: none; }
      #modal-overlay > * { pointer-events: auto; }

      /* Scenario Briefing / Special Rules viewer (Phase 5.5 Stage 7,
         src/ui/play/specialRulesModal.ts) — a separate overlay from
         #modal-overlay above because it's opened voluntarily by the player
         at any time (topbar button), not a game-state interrupt, so it
         doesn't participate in that overlay's mutual-exclusivity logic. */
      #special-rules-modal-overlay { position: absolute; inset: 0; pointer-events: none; }
      #special-rules-modal-overlay:empty { display: none; }
      #special-rules-modal-overlay > * { pointer-events: auto; }

      /* Skirmish Fire target-picker modal (src/ui/play/skirmishFireModal.ts,
         human-requested 2026-08-25 replacement for the old hover-anchored
         per-hex dialog, which was too easy to lose with a small mouse
         movement) — same centered/dimmed shell as #modal-overlay above,
         since a plain tile click was already a no-op for the whole
         `pending.kind === "skirmishFire"` phase (targeting is entirely
         menu-driven, not board-click-driven). */
      #skirmish-fire-modal-overlay { position: absolute; inset: 0; pointer-events: none; }
      #skirmish-fire-modal-overlay:empty { display: none; }
      #skirmish-fire-modal-overlay > * { pointer-events: auto; }

      /* Hit-allocation picker (src/ui/play/killAllocationModal.ts) — shown
         when a Fire/Close Combat result must be split between several enemy
         units stacked in one hex. Same centered/dimmed shell as
         #skirmish-fire-modal-overlay above; its own overlay so a sibling
         modal's null-clear can't wipe it mid-render. */
      #kill-allocation-modal-overlay { position: absolute; inset: 0; pointer-events: none; }
      #kill-allocation-modal-overlay:empty { display: none; }
      #kill-allocation-modal-overlay > * { pointer-events: auto; }

      /* Sequential turn-phase walkthrough's own dialogs (src/ui/play/
         armyMoraleReportModal.ts, leaderPhaseModal.ts, phaseInstructionModal.ts,
         passageOfTimeReportModal.ts) — same centered/dimmed shell as
         #modal-overlay above, and main.ts's renderCurrentPhaseModal already
         guarantees at most one of these four is ever populated at once (one
         per `currentPhase`, mutually exclusive with #modal-overlay's own
         reactionWindow/assaultSkirmisherChoice/leaderFallenNotice/
         yourTurnNotice tier too — see renderEndTurnModal). Kept as separate
         elements (not sharing one overlay) rather than risk one dialog's own
         null-clear wiping out another rendered into the same container the
         same render() pass, same reasoning as every other modal pairing on
         this page. */
      #army-morale-report-modal-overlay { position: absolute; inset: 0; pointer-events: none; }
      #army-morale-report-modal-overlay:empty { display: none; }
      #army-morale-report-modal-overlay > * { pointer-events: auto; }
      #dice-roll-modal-overlay { position: absolute; inset: 0; pointer-events: none; }
      #dice-roll-modal-overlay:empty { display: none; }
      #dice-roll-modal-overlay > * { pointer-events: auto; }
      #leader-phase-modal-overlay { position: absolute; inset: 0; pointer-events: none; }
      #leader-phase-modal-overlay:empty { display: none; }
      #leader-phase-modal-overlay > * { pointer-events: auto; }
      #phase-instruction-modal-overlay { position: absolute; inset: 0; pointer-events: none; }
      #phase-instruction-modal-overlay:empty { display: none; }
      #phase-instruction-modal-overlay > * { pointer-events: auto; }
      /* endActivationWarningModal.ts — "you still have units to activate"
         confirm raised by the topbar's End Phase click during Phase 5. Not
         driven by `currentPhase` (it's a voluntary confirm on top of the
         activation phase, not a phase of its own), so its own overlay rather
         than a branch of renderCurrentPhaseModal. */
      #end-activation-warning-modal-overlay { position: absolute; inset: 0; pointer-events: none; }
      #end-activation-warning-modal-overlay:empty { display: none; }
      #end-activation-warning-modal-overlay > * { pointer-events: auto; }
      /* exitBoardConfirmModal.ts — "exit the board?" confirm raised by the
         order modal's Corunna-only (Free) "Exit Board" action, same
         voluntary-confirm-on-top-of-a-phase pattern as the warning above. */
      #exit-board-confirm-modal-overlay { position: absolute; inset: 0; pointer-events: none; }
      #exit-board-confirm-modal-overlay:empty { display: none; }
      #exit-board-confirm-modal-overlay > * { pointer-events: auto; }
      #passage-of-time-report-modal-overlay { position: absolute; inset: 0; pointer-events: none; }
      #passage-of-time-report-modal-overlay:empty { display: none; }
      #passage-of-time-report-modal-overlay > * { pointer-events: auto; }
      /* reserveCheckReportModal.ts — same centered/dimmed shell as the four
         above, but not driven by `currentPhase` (Commit Reserves allows
         several sequential staff-check attempts within the one phase), so
         it's a separate overlay rather than a fifth mutually-exclusive
         branch of renderCurrentPhaseModal. */
      #reserve-check-report-modal-overlay { position: absolute; inset: 0; pointer-events: none; }
      #reserve-check-report-modal-overlay:empty { display: none; }
      #reserve-check-report-modal-overlay > * { pointer-events: auto; }

      /* Order popover (src/ui/play/orderModal.ts) — anchored to the
         selected unit's own on-screen position, so it lives inside
         #board-col (position:relative) rather than as a viewport-fixed
         overlay; main.ts computes the anchor in #board-col-relative pixels.
         No backdrop dimming — human feedback 2026-08-17: the popover
         shouldn't block or obscure the rest of the board. z-index above
         #log-toggle so it never loses a stacking fight near the board's
         left edge. */
      #order-modal-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
      #order-modal-overlay:empty { display: none; }

      /* Redeploy's formation/facing popover (src/ui/play/redeployModal.ts)
         — same wrapper pattern and z-index as #order-modal-overlay above;
         the two are never populated at once (Redeploy clears selection's
         order popover by setting `pending`, see orderModalAnchor's callers
         in main.ts), so there's no stacking conflict between them. */
      #redeploy-modal-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
      #redeploy-modal-overlay:empty { display: none; }

      /* March's arrival-facing popover (src/ui/play/marchFacingModal.ts) —
         same wrapper pattern and z-index as #order-modal-overlay above;
         only ever populated while `pending.kind === "marchFacing"`, which
         implies no `pending`-less order popover and no Redeploy popover at
         the same time, so no stacking conflict with either. */
      #march-facing-modal-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
      #march-facing-modal-overlay:empty { display: none; }

      /* Leader-order popover (src/ui/play/leaderOrderModal.ts, Phase 5
         Stage 7 increment 2) — same wrapper pattern and z-index as
         #order-modal-overlay above; mutually exclusive with it (selecting a
         leader clears the selected unit and vice versa, see main.ts's
         selectLeader/selectUnit), so no stacking conflict between them. */
      #leader-order-modal-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
      #leader-order-modal-overlay:empty { display: none; }

      /* Army HQ order popover (src/ui/play/armyHqOrderModal.ts, Phase 6
         Stage 7 increment 2) — same wrapper pattern/z-index/mutual-exclusion
         shape as #leader-order-modal-overlay above (see main.ts's
         selectArmyHq/selectLeader/selectUnit). */
      #army-hq-order-modal-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
      #army-hq-order-modal-overlay:empty { display: none; }

      /* Exchange picker (src/ui/play/exchangeLeaderModal.ts, Phase 6 Stage 7
         increment 3) — same wrapper pattern/z-index as the popovers above. */
      #exchange-leader-modal-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
      #exchange-leader-modal-overlay:empty { display: none; }

      /* Reserve Commitment/Flank March wizard (src/ui/play/reserveCommitmentModal.ts,
         Phase 6 Stage 7 increment 4) — same wrapper pattern/z-index as the
         popovers above; opened from the Army HQ popover once
         `state.pending` enters one of its own kinds (renderArmyHqOrderModalPanel
         hides its own popover for the same HQ while that's true, so the two
         never stack). */
      #reserve-commitment-modal-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
      #reserve-commitment-modal-overlay:empty { display: none; }

      /* Replace-leader wizard (src/ui/play/replaceLeaderModal.ts, Phase 5
         Stage 7 increment 2) — same wrapper pattern and z-index as
         #order-modal-overlay above; opening it clears both selectedUnitId
         and selectedLeaderId (main.ts's openReplaceLeaderWizard), so it's
         never populated alongside either of the popovers above. */
      #replace-leader-modal-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
      #replace-leader-modal-overlay:empty { display: none; }

      /* Leader accompany/drop-off popover (src/ui/play/leaderAccompanyModal.ts,
         2026-08-24) — same wrapper pattern and z-index as
         #march-facing-modal-overlay above; only ever populated while
         `pending.kind === "leaderAccompany"`, which (like marchFacing) only
         ever follows a March/Advance-Retire destination pick, so no
         stacking conflict with the other popovers here. */
      #leader-accompany-modal-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
      #leader-accompany-modal-overlay:empty { display: none; }

      /* Skirmisher-recall confirm popover (src/ui/play/skirmisherRecallModal.ts,
         human-reported 2026-08-24 bug fix) — same shell/z-index as
         #leader-accompany-modal-overlay above; only ever populated while
         `pending.kind === "confirmSkirmisherRecall"`, which precedes
         leaderAccompany in the same March/Advance-Retire flow, so no
         stacking conflict there either. */
      #skirmisher-recall-modal-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
      #skirmisher-recall-modal-overlay:empty { display: none; }


      /* Order of Battle screen (Stage 4, src/ui/orderOfBattle.ts) — a
         full-width screen shown instead of #play-topbar/#play-grid (toggled
         by main.ts off the Router's current screen), not a modal. */
      #oob-screen { display: none; overflow-y: auto; height: 100%; background: var(--color-bg); }

      /* Victory screen (src/ui/victoryScreen.ts) — same full-width-instead-
         of-#play-topbar/#play-grid pattern as #oob-screen above; shows p.4's
         three game-end conditions and live progress toward each. */
      #victory-screen { display: none; overflow-y: auto; height: 100%; background: var(--color-bg); }

      /* Menu screen (Track B stage B-2, src/ui/menu.ts) — same
         full-width-instead-of-#play-topbar/#play-grid pattern as #oob-screen
         above, also hosting the Login screen inline when signed out. */
      #menu-screen { display: none; overflow-y: auto; height: 100%; background: var(--color-bg); }

      /* Scenario picker / Create-game screen (Track B stage B-3b,
         src/ui/scenarioPicker.ts) — same pattern as #menu-screen above. */
      #scenario-picker-screen { display: none; overflow-y: auto; height: 100%; background: var(--color-bg); }

      /* Join screen (Track B stage B-4, src/ui/join.ts) — same pattern as
         #menu-screen above. */
      #join-screen { display: none; overflow-y: auto; height: 100%; background: var(--color-bg); }

      /* Admin screen (Track B stage B-6, src/ui/admin.ts) — same pattern as
         #menu-screen above. */
      #admin-screen { display: none; overflow-y: auto; height: 100%; background: var(--color-bg); }

      /* Phase 5.5 scenario-authoring tool (dev-only, src/ui/scenarioAuthor.ts)
         — same pattern as #menu-screen above. Never linked to in the
         production bundle; main.ts only mounts it under import.meta.env.DEV. */
      #scenario-author-screen { display: none; overflow-y: auto; height: 100%; background: var(--color-bg); }
    </style>
    <script type="module" crossorigin src="./assets/index-DppQc61O.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cf3tRmyv.css">
  </head>
  <body>
    <div id="app-shell">
      <header id="nav-bar"></header>
      <div id="app-content">
        <div id="play-topbar"></div>
        <div id="battle-time-bar"></div>
        <div id="turn-order-ribbon"></div>
        <div id="play-grid">
          <div id="play-log"></div>
          <div id="deploy-sidebar"></div>
          <div id="board-col">
            <div id="app"></div>
            <div id="network-banner" class="top-banner" style="display:none;"></div>
            <div id="action-banner" class="top-banner" style="display:none;"></div>
            <div id="ui"></div>
            <div id="deploy-panel"></div>
            <div id="view-controls"></div>
            <button id="log-toggle"></button>
            <div id="order-modal-overlay"></div>
            <div id="redeploy-modal-overlay"></div>
            <div id="march-facing-modal-overlay"></div>
            <div id="leader-order-modal-overlay"></div>
            <div id="army-hq-order-modal-overlay"></div>
            <div id="exchange-leader-modal-overlay"></div>
            <div id="reserve-commitment-modal-overlay"></div>
            <div id="replace-leader-modal-overlay"></div>
            <div id="leader-accompany-modal-overlay"></div>
            <div id="skirmisher-recall-modal-overlay"></div>
          </div>
          <div id="play-inspector"></div>
        </div>
        <div id="oob-screen"></div>
        <div id="victory-screen"></div>
        <div id="menu-screen"></div>
        <div id="scenario-picker-screen"></div>
        <div id="join-screen"></div>
        <div id="admin-screen"></div>
        <div id="scenario-author-screen"></div>
      </div>
      <div id="modal-overlay"></div>
      <div id="special-rules-modal-overlay"></div>
      <div id="skirmish-fire-modal-overlay"></div>
      <div id="kill-allocation-modal-overlay"></div>
      <div id="army-morale-report-modal-overlay"></div>
      <div id="dice-roll-modal-overlay"></div>
      <div id="leader-phase-modal-overlay"></div>
      <div id="phase-instruction-modal-overlay"></div>
      <div id="end-activation-warning-modal-overlay"></div>
      <div id="exit-board-confirm-modal-overlay"></div>
      <div id="passage-of-time-report-modal-overlay"></div>
      <div id="reserve-check-report-modal-overlay"></div>
    </div>
  </body>
</html>
